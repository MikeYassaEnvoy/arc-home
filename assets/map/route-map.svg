<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520" role="img" aria-label="Souvenir race map — all around the house">
<title>Souvenir race map — all around the house</title>
<defs>
  <clipPath id="mapclip"><rect x="4" y="4" width="892" height="512" rx="22"/></clipPath>
</defs>
<style>
  .segment{transition:opacity .45s ease}
  .segment.locked{opacity:.14}
  .segment.done .seg-line{stroke:#DA291C}
  .node{transition:opacity .45s ease}
  .node.locked .node-disc{fill:#DCD5C1}
  .node.locked .node-num{fill:#8B856E}
  .node-pulse{opacity:0;transform-box:fill-box;transform-origin:center}
  .node.current .node-pulse{opacity:1;animation:ar-pulse 1.7s ease-out infinite}
  @keyframes ar-pulse{0%{transform:scale(.85);opacity:.85}100%{transform:scale(2.1);opacity:0}}
  @media (prefers-reduced-motion:reduce){.node.current .node-pulse{animation:none;opacity:.5}}
</style>
<g clip-path="url(#mapclip)">
  <!-- sky + grass -->
  <rect x="4" y="4" width="892" height="512" fill="#BFEAFB"/>
  <rect x="4" y="398" width="892" height="118" fill="#A8E6A0"/>
  <path d="M4 398h892" stroke="#7FBF6E" stroke-width="4"/>
  <!-- sun -->
  <g stroke="#1A1A1A" stroke-width="4" stroke-linecap="round">
    <circle cx="836" cy="76" r="26" fill="#FFC20E"/>
    <path d="M836 34v-12M836 118v12M794 76h-12M878 76h12M806 46l-8-8M866 106l8 8M866 46l8-8M806 106l-8 8"/>
  </g>
