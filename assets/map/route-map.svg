    <text x="505" y="480" text-anchor="middle" font-family="Helvetica Neue, Helvetica, Arial, sans-serif" font-size="17" font-weight="700" fill="#1A1A1A" stroke="#FFFFFF" stroke-width="5" paint-order="stroke">KITCHEN</text>
