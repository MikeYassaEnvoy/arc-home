  <circle cx="238" cy="428" r="3.5" fill="#FFC20E" stroke="#1A1A1A" stroke-width="2"/>
  <!-- living room: TV + couch -->
  <rect x="292" y="346" width="76" height="46" rx="4" fill="#59616B" stroke="#1A1A1A" stroke-width="4"/>
  <rect x="298" y="352" width="64" height="34" rx="2" fill="#7FD4F5" stroke="#1A1A1A" stroke-width="2.5"/>
  <g stroke="#1A1A1A" stroke-width="4" stroke-linejoin="round">
