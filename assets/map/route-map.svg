    <path d="M-16-10h30l6 8h-42z" fill="#BFEAFB"/>
    <circle cx="-18" cy="8" r="7" fill="#1A1A1A" stroke="none"/><circle cx="20" cy="8" r="7" fill="#1A1A1A" stroke="none"/>
